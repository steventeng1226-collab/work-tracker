<script>
(function(){
  function makeIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const gap = Math.round(size * 0.04);
    const half = Math.round((size - gap * 3) / 2);
    const r = Math.round(size * 0.10);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(0,0,size,size,size*0.18);
    else ctx.rect(0,0,size,size);
    ctx.fill();
    const cells=[
      {x:gap,       y:gap,       bg:'#FCEBEB',fg:'#A32D2D',t:'P1'},
      {x:gap*2+half,y:gap,       bg:'#FAEEDA',fg:'#854F0B',t:'P2'},
      {x:gap,       y:gap*2+half,bg:'#f0f0f0',fg:'#555555',t:'P3'},
      {x:gap*2+half,y:gap*2+half,bg:'#EAF3DE',fg:'#27500A',t:'P4'},
    ];
    cells.forEach(({x,y,bg,fg,t})=>{
      ctx.fillStyle=bg;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x,y,half,half,r);
      else ctx.rect(x,y,half,half);
      ctx.fill();
      ctx.fillStyle=fg;
      ctx.font=`bold ${Math.round(half*0.38)}px sans-serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(t,x+half/2,y+half/2);
    });
    return c.toDataURL('image/png');
  }
  window.addEventListener('DOMContentLoaded',function(){
    try{
      const i192=makeIcon(192);
      const i512=makeIcon(512);
      const manifest={name:'工作追蹤',short_name:'工作追蹤',start_url:'./',display:'standalone',background_color:'#ffffff',theme_color:'#ffffff',orientation:'portrait',icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
      const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
      const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(blob);document.head.appendChild(ml);
      const al=document.createElement('link');al.rel='apple-touch-icon';al.href=i192;document.head.appendChild(al);
    }catch(e){console.warn('icon err',e);}
  });
})();

<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

const HARDCODED_GAS_URL = 'https://script.google.com/macros/s/AKfycby-eh45LbxCdyks7fhIoWpvkocbOVKBqXmH3zNvuwIjQdQqGpFGvpWIkzBskReWHHP7hg/exec';
let GAS_URL = HARDCODED_GAS_URL;
try { localStorage.setItem('gas_url', GAS_URL); } catch(e) {}

const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const todayDisplay = () => { const d = new Date(); return `${d.getFullYear()} / ${d.getMonth()+1} / ${d.getDate()}`; };
const todayWD = () => WEEKDAYS[new Date().getDay()];
const fmtShort = s => { if(!s) return ''; const d = new Date(s + 'T00:00:00'); if(isNaN(d)) return s; return `${d.getMonth()+1}/${d.getDate()}`; };
const utcToLocalTime = utcISO => { if (!utcISO) return ''; try { const d = new Date(utcISO); if (isNaN(d)) return ''; const h = d.getHours(); const mi = d.getMinutes(); return (h < 10 ? '0'+h : h) + ':' + (mi < 10 ? '0'+mi : mi); } catch(e) { return ''; } };
const utcToLocalDate = utcISO => { if (!utcISO) return ''; try { const d = new Date(utcISO); if (isNaN(d)) return ''; const y = d.getFullYear(); const mo = String(d.getMonth()+1).padStart(2,'0'); const dy = String(d.getDate()).padStart(2,'0'); return `${y}-${mo}-${dy}`; } catch(e) { return ''; } };
const fmtFull = s => { if(!s) return '—'; const d = new Date(s + 'T00:00:00'); if(isNaN(d)) return s; return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
const isOverdue = dueDate => { if(!dueDate) return false; const due = new Date(dueDate + 'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0); return due < now; };
const isMeetingOver = (m) => { try { if (m.endUTC) return new Date(m.endUTC) < new Date(); const endStr = m.endTime || m.startTime; if (!endStr) return false; const today = todayStr(); return new Date(today + 'T' + endStr + ':00') < new Date(); } catch(e) { return false; } };
const thisWeekRange = () => { const now = new Date(); now.setHours(0,0,0,0); const week = new Date(now); week.setDate(week.getDate()+7); return { now, week }; };
const normP = p => { const m = String(p||'').match(/P[1-4]/); return m ? m[0] : 'P3'; };
const PMAP = { P1:{badge:'p1-b',text:'p1-t',label:'緊急'}, P2:{badge:'p2-b',text:'p2-t',label:'重要'}, P3:{badge:'p3-b',text:'p3-t',label:'一般'}, P4:{badge:'p4-b',text:'p4-t',label:'備忘'} };
const pInfo = p => PMAP[p] || PMAP.P3;
const sortByPriority = tasks => [...tasks].sort((a, b) => {
  const pa = parseInt(normP(a.priority).slice(1)); const pb = parseInt(normP(b.priority).slice(1));
  if (pa !== pb) return pa - pb;
  const oa = isOverdue(a.dueDate) ? 0 : 1; const ob = isOverdue(b.dueDate) ? 0 : 1;
  if (oa !== ob) return oa - ob;
  return new Date(a.dueDate || '9999') - new Date(b.dueDate || '9999');
});

// ── 圖片壓縮 ──────────────────────────────────────────────
const resizeB64 = (base64, type) => new Promise(resolve => {
  const img = new Image();
  img.onload = () => {
    const MAX = 1024;
    const s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
  };
  img.onerror = () => resolve(base64);
  img.src = `data:${type||'image/jpeg'};base64,${base64}`;
});

// ── Gemini 圖片分析 ──────────────────────────────────────
const analyzeWithGemini = async (base64, mimeType) => {
  const key = localStorage.getItem('gemini_key') || '';
  if (!key) throw new Error('NOKEY');

const fetchWithTimeout = (url, options={}, ms=30000) => {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(t));
};
const api = {
  async get(action, params = {}) {
    if (!GAS_URL) GAS_URL = HARDCODED_GAS_URL;
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetchWithTimeout(`${GAS_URL}?${qs}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    return data;
  },
  async post(body) {
    if (!GAS_URL) GAS_URL = HARDCODED_GAS_URL;
    const res = await fetchWithTimeout(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    return data;
  },
  getMeetings: d => api.get('getMeetings', { date: d }),
  getTasks:    () => api.get('getTasks'),
  getHistory:  () => api.get('getHistory'),
  getMembers:  () => api.get('getMembers'),
  addTask:     data => api.post({ action:'addTask', ...data }),
  updateTask:  (id, data) => api.post({ action:'updateTask', id, ...data }),
  closeTask:   (id, data) => api.post({ action:'closeTask', id, ...data }),
  deleteTask:  id => api.post({ action:'deleteTask', id }),
  deleteHistory: id => api.post({ action:'deleteHistory', id }),
  uploadImage: (base64, filename, taskId) => api.post({ action:'uploadImage', base64, filename, taskId }),
};

const matchNotes = (notes, title, category) => {
  if (!notes.length || (!title && !category)) return [];

      {meetings.map((m, i) => {
        const over = isMeetingOver(m);
        const st = (m.startUTC ? utcToLocalTime(m.startUTC) : m.startTime) || m.startTime;
        const et = (m.endUTC ? utcToLocalTime(m.endUTC) : m.endTime) || m.endTime;
        return (
          <div key={i}>
            <div onClick={() => setExpanded(expanded===i?null:i)} style={{background:over?'#f8f8f8':'#fff',padding:'12px 16px',borderBottom:'0.5px solid #f2f2f2',display:'flex',alignItems:'center',gap:10,cursor:'pointer',WebkitTapHighlightColor:'transparent'}}>
              <div style={{width:22,height:22,borderRadius:'50%',flexShrink:0,background:over?'#ddd':'#1D9E75',display:'flex',alignItems:'center',justifyContent:'center'}}>
                {over ? <span style={{color:'#fff',fontSize:13,lineHeight:1}}>✓</span> : <span style={{width:7,height:7,borderRadius:'50%',background:'#fff',display:'block'}}/>}
              </div>
              <span style={{fontSize:12,width:78,flexShrink:0,whiteSpace:'nowrap',color:over?'#ccc':'#555',fontWeight:over?400:500,textDecoration:over?'line-through':'none'}}>{st}{et?'–'+et:''}</span>
              <span style={{flex:1,fontSize:14,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',color:over?'#bbb':'#1a1a1a',fontWeight:over?400:600,textDecoration:over?'line-through':'none'}}>{m.title}</span>
              <span style={{fontSize:18,color:'#ccc',flexShrink:0,padding:'0 4px'}}>{expanded===i?'∨':'›'}</span>
            </div>
            {expanded === i && <div style={{background:'#f9f9f9',padding:'10px 16px 10px 52px',borderBottom:'0.5px solid #f2f2f2',fontSize:13,color:'#666',lineHeight:1.7}}>{m.location ? <div>📍 {m.location}</div> : <div style={{color:'#bbb'}}>無詳細資訊</div>}</div>}
          </div>
        );
      })}
    </div>
  );
};

// TASK FORM PAGE
// ════════════════════════════════════════════════════
const TaskFormPage = ({ initial, members, onBack, onSave, mode = 'add', defaultCategory = '工作' }) => {
  const blank = { priority:'P1', title:'', owner:'', dueDate:'', completionDate:'', progress:'', reflection:'', createdDate: todayStr(), category: defaultCategory, next_step:'' };
  const [form, setForm] = useState(initial ? { ...blank, ...initial } : blank);
  const [saving, setSaving] = useState(false);
  const [analyzing, setAnalyzing] = useState(false);
  const [noteExpanded, setNoteExpanded] = useState(false);
  const [allNotes] = useState(() => getNotes());
  const relatedNotes = useMemo(() => matchNotes(allNotes, form.title, form.category), [allNotes, form.title, form.category]);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const [aiEngine, setAiEngine] = useState(localStorage.getItem('ai_engine') || 'gemini');

  const processFile = useCallback(async (file) => {
    const isHTML = file.type === 'text/html' || file.type === 'message/rfc822' || /\.(html?|mht|eml)$/i.test(file.name);
    setAnalyzing(true);
    if (isHTML) {
      try {
        const rawText = await file.text();
        const clean = rawText.replace(/<style[^>]*>[\s\S]*?<\/style>/gi,'').replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/\s{2,}/g,'\n').trim().slice(0,10000);
        const engine = localStorage.getItem('ai_engine') || 'gemini';
        const result = engine === 'claude' ? await analyzeTextWithClaude(clean, localStorage.getItem('claude_key')||'') : await analyzeTextWithGemini(clean, localStorage.getItem('gemini_key')||'');
        applyAIResult(result);
      } catch(err) { alert('Email 分析失敗：' + err.message); }
      setAnalyzing(false); return;
    }
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const base64 = ev.target.result.split(',')[1];
        const engine = localStorage.getItem('ai_engine') || 'gemini';
        const result = engine === 'claude' ? await analyzeWithClaude(base64, file.type||'image/jpeg') : await analyzeWithGemini(base64, file.type||'image/jpeg');
        applyAIResult(result);
      } catch(err) { alert(err.message === 'NOKEY' ? '請先在 ⚙ 設定 Gemini API Key' : 'AI 分析失敗：' + err.message); }
      setAnalyzing(false);
    };
    reader.readAsDataURL(file);
  }, [mode, form.progress]);

  const applyAIResult = useCallback((result) => {
    if (mode === 'add') {
      setForm(f => ({ ...f, priority:result.priority||f.priority, title:result.title||f.title, owner:result.owner||f.owner, dueDate:result.dueDate||f.dueDate, category:result.category||f.category, progress:result.progress||f.progress, next_step:result.next_step||f.next_step }));
    } else {
      const dateStr = new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});
      const entry = `[${dateStr} AI更新]\n${result.progress}`;
      setForm(f => ({ ...f, progress:f.progress?f.progress+'\n\n'+entry:entry, next_step:result.next_step||f.next_step }));
    }
  }, [mode]);

  const [pendingImages, setPendingImages] = useState([]);
  const [dragging, setDragging] = useState(false);
  const pasteInputRef = useRef(null);

  const addToPending = useCallback((file) => {
    const isHTMLFile = file.type==='text/html'||file.type==='message/rfc822'||/\.(html?|mht|eml)$/i.test(file.name);
    if (isHTMLFile) { processFile(file); return; }
    setPendingImages(prev => {
      if (prev.length >= 3) { alert('最多同時分析 3 張'); return prev; }
      const reader = new FileReader();
      reader.onload = ev => { const dataUrl = ev.target.result; setPendingImages(p => [...p, { base64:dataUrl.split(',')[1], type:file.type||'image/jpeg', preview:file.type==='application/pdf'?null:dataUrl }]); };
      reader.readAsDataURL(file);
      return prev;
    });
  }, [processFile]);

  const analyzeAll = useCallback(async () => {
    if (!pendingImages.length || analyzing) return;
    const engine = aiEngine;
    const key = engine === 'claude' ? localStorage.getItem('claude_key')||'' : localStorage.getItem('gemini_key')||'';
    if (!key) { alert(`請先在 ⚙ 設定 ${engine==='claude'?'Claude':'Gemini'} API Key`); return; }
    setAnalyzing(true);
    try {
      const result = engine === 'claude' ? await analyzeMultipleWithClaude(pendingImages, key) : await analyzeMultipleWithGemini(pendingImages, key);
      applyAIResult(result); setPendingImages([]);
    } catch(err) { alert('AI 分析失敗：' + err.message); }
    setAnalyzing(false);
  }, [pendingImages, analyzing, applyAIResult, aiEngine]);

  useEffect(() => {
    const onPaste = (e) => {
      if (analyzing) return;
      const img = Array.from(e.clipboardData?.items||[]).find(i=>i.type.startsWith('image/'));
      if (!img) return; e.preventDefault(); addToPending(img.getAsFile());
    };
    document.addEventListener('paste', onPaste);
    return () => document.removeEventListener('paste', onPaste);
  }, [analyzing, addToPending]);

  const handleDrop = (e) => { e.preventDefault(); setDragging(false); if(!analyzing) Array.from(e.dataTransfer.files).forEach(addToPending); };
  const handleDragOver = (e) => { e.preventDefault(); setDragging(true); };
  const handleDragLeave = (e) => { if(!e.currentTarget.contains(e.relatedTarget)) setDragging(false); };

  const handleSave = async () => {
    if (!form.title.trim()) { alert('請填入追蹤事項'); return; }
    setSaving(true);
    try { await onSave(form); } finally { setSaving(false); }
  };

  return (
    <div className="form-wrap" onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave} style={{position:'relative'}}>
      {dragging && <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:999,background:'rgba(102,126,234,0.15)',border:'3px dashed #667eea',display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><div style={{background:'#667eea',color:'#fff',padding:'16px 32px',borderRadius:12,fontSize:16,fontWeight:600}}>📎 放開加入分析</div></div>}
      <div className="page-hdr">
        <span className="back-btn" onClick={onBack}>‹</span>
        <span className="page-hdr-title">{mode==='add'?'新增任務':'編輯任務'}</span>
        <span></span>
      </div>
      {mode === 'add' && (
        <div style={{padding:'12px 16px 8px',background:'var(--card)',marginBottom:8}}>
          <div style={{display:'flex',gap:6,marginBottom:10}}>
            {[{id:'gemini',label:'G Gemini',color:'#4285F4'},{id:'claude',label:'C Claude',color:'#D97706'}].map(e => (
              <button key={e.id} onClick={() => { setAiEngine(e.id); localStorage.setItem('ai_engine', e.id); }}
                style={{flex:1,padding:'6px 0',borderRadius:8,fontSize:12,fontWeight:600,border:aiEngine===e.id?'none':'1px solid var(--border)',background:aiEngine===e.id?e.color:'#f7f7f7',color:aiEngine===e.id?'#fff':'#999',cursor:'pointer',fontFamily:'inherit',transition:'all 0.15s'}}>
                {e.label} {aiEngine===e.id?'✓':''}
              </button>
            ))}
          </div>
          {pendingImages.length === 0 ? (
            <div className="paste-zone-empty" onClick={() => pasteInputRef.current?.click()}>
              <div style={{fontSize:28,marginBottom:6}}>📎</div>
              <div style={{fontSize:13,fontWeight:600,color:'#667eea'}}>拖入 / Ctrl+V 貼上 / 點擊選取</div>
              <div style={{fontSize:11,color:'#bbb',marginTop:4}}>截圖、圖片、PDF、HTML ｜ 最多 3 張一起分析</div>
            </div>
          ) : (
            <div className="paste-zone-filled">
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
                {pendingImages.map((img,i) => (
                  <div key={i} className="img-thumb-wrap">
                    {img.preview ? <img src={img.preview} className="img-thumb" alt={`img${i+1}`}/> : <div className="img-thumb" style={{display:'flex',alignItems:'center',justifyContent:'center',background:'#F0ECFF',fontSize:28}}>📄</div>}
                    <div className="img-thumb-del" onClick={() => setPendingImages(p=>p.filter((_,j)=>j!==i))}>×</div>
                  </div>
                ))}
                {pendingImages.length < 3 && <div className="img-thumb-add" onClick={() => pasteInputRef.current?.click()}>＋</div>}
              </div>
              <button className="ai-fill-btn" onClick={analyzeAll} disabled={analyzing} style={{margin:0}}>
                <span>{analyzing?'🤖':'✨'}</span>
                <span>{analyzing?'AI 分析中...':`AI 分析（${pendingImages.length} 張）`}</span>
              </button>
            </div>
          )}
          <input ref={pasteInputRef} type="file" accept="image/*,.pdf,.html,.htm,.mht,.eml" multiple style={{display:'none'}} onChange={e => { Array.from(e.target.files).forEach(addToPending); e.target.value=''; }}/>
        </div>
      )}
      {relatedNotes.length > 0 && (
        <div className="note-reminder-bar" style={{marginBottom:8}}>
          <div onClick={() => setNoteExpanded(e=>!e)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
            <span style={{fontSize:12,fontWeight:600,color:'#5B3EA0'}}>💡 相關筆記提醒（{relatedNotes.length} 條）</span>
            <span style={{fontSize:14,color:'#667eea'}}>{noteExpanded?'∧':'∨'}</span>
          </div>
          {noteExpanded && relatedNotes.map((n,i) => (
            <div key={n.id} style={{marginTop:8,paddingTop:8,borderTop:'0.5px solid #D4CCFF'}}>
              {n.category && <div style={{fontSize:10,color:'#667eea',fontWeight:600,marginBottom:2}}>{n.category}</div>}
              <div style={{fontSize:12,fontWeight:500,color:'#1a1a1a',marginBottom:n.points?4:0}}>{n.conclusion}</div>
              {n.points && <div style={{fontSize:11,color:'#555',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{n.points}</div>}
            </div>
          ))}
        </div>
      )}
      <div className="form-section">
        <div className="form-row">
          <span className="f-label">類別</span>
          <div style={{display:'flex',gap:8,flex:1}}>
            {['工作','生活'].map(cat => (
              <button key={cat} onClick={() => set('category',cat)} style={{flex:1,padding:'6px 0',borderRadius:7,border:form.category===cat?'none':'0.5px solid var(--border)',background:form.category===cat?(cat==='工作'?'#185FA5':'#3B6D11'):'#fff',color:form.category===cat?'#fff':'var(--text-muted)',fontSize:13,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}}>{cat==='工作'?'💼 工作':'🏠 生活'}</button>
            ))}
          </div>
        </div>
        <div className="form-row">
          <span className="f-label">優先等級</span>
          <select value={form.priority} onChange={e => set('priority',e.target.value)}>
            <option value="P1">P1 極急</option><option value="P2">P2 重要</option><option value="P3">P3 一般</option><option value="P4">P4 備忘</option>
          </select>
        </div>
        <div className="form-row">
          <span className="f-label">追蹤事項</span>
          <input type="text" placeholder="任務標題" value={form.title} onChange={e => set('title',e.target.value)}/>
        </div>
      </div>
      <div className="form-section">
        <div className="form-row">
          <span className="f-label">負責人</span>
          <select value={form.owner} onChange={e => set('owner',e.target.value)}>
            <option value="">— 選擇 —</option>
            {members.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>
        <div className="form-row"><span className="f-label">預定完成日</span><input type="date" value={form.dueDate} onChange={e => set('dueDate',e.target.value)}/></div>
        <div className="form-row"><span className="f-label">實際完成日</span><input type="date" value={form.completionDate} onChange={e => set('completionDate',e.target.value)}/></div>
      </div>
      <div className="form-section">
        <div className="form-textarea-wrap">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <label style={{marginBottom:0}}>處理過程履歷</label>
            {mode === 'edit' && (
              <label className="ai-append-btn" style={{opacity:analyzing?0.6:1}} onDrop={handleDrop} onDragOver={handleDragOver}>
                {analyzing?'🤖 分析中...':'🤖 AI追加（拍照/貼上）'}
                <input type="file" accept="image/*,.pdf,.html,.htm,.mht,.eml" style={{display:'none'}} disabled={analyzing} onChange={e => { if(e.target.files[0]) processFile(e.target.files[0]); e.target.value=''; }}/>
              </label>
            )}
          </div>
          <textarea placeholder="AI 自動填入，或手動記錄處理過程..." value={form.progress} rows={8} onChange={e => set('progress',e.target.value)} style={{width:'100%',border:'none',outline:'none',fontSize:13,background:'transparent',color:'var(--text)',fontFamily:'inherit',resize:'none',lineHeight:1.8}}/>
        </div>
      </div>
      <div className="form-section">
        <div className="form-row" style={{alignItems:'flex-start',gap:8}}>
          <span className="f-label" style={{paddingTop:4,color:'#667eea',fontWeight:600}}>🔜 下一步</span>
          <input type="text" placeholder="AI 自動產生，或手動輸入..." value={form.next_step} onChange={e => set('next_step',e.target.value)} style={{fontSize:13,color:'#185FA5',fontWeight:500}}/>
        </div>
        {form.next_step && <div style={{padding:'0 16px 8px',fontSize:11,color:'#bbb'}}>此欄內容將顯示在首頁任務列表下方</div>}
      </div>
      <div className="form-section">
        <div className="form-textarea-wrap">
          <label>結案心得</label>
          <textarea placeholder="結案後的心得與改善方向..." value={form.reflection} rows={3} onChange={e => set('reflection',e.target.value)}/>
        </div>
      </div>
      <div className="form-section">
        <div className="form-row"><span className="f-label">立案日期</span><input type="date" value={form.createdDate||todayStr()} onChange={e => set('createdDate',e.target.value)}/></div>
      </div>
      <div className="btn-row">
        <button className="btn btn-primary" onClick={handleSave} disabled={saving} style={{flex:2}}>{saving?'儲存中...':'存檔'}</button>
        <button className="btn btn-secondary" onClick={onBack} style={{flex:1}}>取消</button>
      </div>
    </div>
  );
};

// TASK DETAIL PAGE
// ════════════════════════════════════════════════════
const TaskDetailPage = ({ task, members, onBack, onSaved, onClosed, onDelete, isHistory = false }) => {
  const [editMode, setEditMode] = useState(false);
  const [closing, setClosing] = useState(false);
  const [current, setCurrent] = useState(task);
  const overdue = isOverdue(current.dueDate);

  const handleSave = async (data) => {
    const fullData = { ...current, ...data };
    await api.updateTask(current.id, fullData);
    setCurrent(fullData); onSaved(current.id, fullData); setEditMode(false);
  };

  const handleClose = async () => {
    if (!window.confirm('確定要結案此任務嗎？')) return;
    setClosing(true);
    try {
      const closeDate = current.completionDate || todayStr();
      await api.closeTask(current.id, { ...current, completionDate: closeDate });
      onClosed(current.id, { ...current, completionDate: closeDate });
    } catch(e) {
      setClosing(false);
      alert(e.name==='AbortError' ? '⚠ 連線逾時（15秒），請確認 Apps Script 已部署且網址正確' : '⚠ 結案失敗：' + e.message);
    }
  };

  if (editMode) return (<TaskFormPage initial={current} members={members} onBack={() => setEditMode(false)} onSave={handleSave} mode="edit"/>);

  return (
    <div className="detail-wrap">
      <div className="page-hdr">
        <span className="back-btn" onClick={onBack}>‹</span>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:8,overflow:'hidden'}}>
          <PBadge level={current.priority}/>
          <span style={{fontSize:15,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{current.title}</span>
        </div>
        <span className="hdr-action" onClick={() => setEditMode(true)}>編輯</span>
      </div>
      <div className="detail-block">
        <div className="detail-meta">
          <div className="detail-field"><div className="df-label">優先等級</div><div className={`df-value ${pInfo(current.priority).text}`}>{current.priority} {pInfo(current.priority).label}</div></div>
          <div className="detail-field"><div className="df-label">負責人</div><div className="df-value">{current.owner||'—'}</div></div>
          <div className="detail-field"><div className="df-label">預定完成日</div><div className="df-value" style={{display:'flex',alignItems:'center',gap:6}}><span style={{color:overdue?'var(--red)':'inherit'}}>{fmtFull(current.dueDate)}</span>{overdue && <span className="overdue-pill">逾期</span>}</div></div>
          {current.completionDate && <div className="detail-field"><div className="df-label">實際完成日</div><div className="df-value">{fmtFull(current.completionDate)}</div></div>}
          <div className="detail-field"><div className="df-label">立案日期</div><div className="df-value">{fmtFull(current.createdDate)}</div></div>
        </div>
      </div>
      {current.progress ? <div className="detail-block"><div className="detail-text"><div className="dt-label">處理過程履歷</div><div className="dt-value">{current.progress}</div></div></div> : null}
      {current.reflection ? <div className="detail-block"><div className="detail-text"><div className="dt-label">結案心得</div><div className="dt-value">{current.reflection}</div></div></div> : null}
      <div className="btn-row">
        {!isHistory && <button className="btn btn-close" onClick={handleClose} disabled={closing}>{closing?'結案中...':'✓ 結案'}</button>}
        <button className="btn btn-edit" onClick={() => setEditMode(true)}>編輯</button>
        <button className="btn btn-secondary" onClick={onBack}>返回</button>
      </div>
      {onDelete && <div style={{padding:'0 16px 20px'}}><button className="btn" style={{width:'100%',background:'#fff',border:'1px solid #E24B4A',color:'#E24B4A'}} onClick={() => onDelete(current.id)}>🗑 刪除此{isHistory?'歷史紀錄':'任務'}</button></div>}
    </div>
  );
};

// HISTORY PAGE
// ════════════════════════════════════════════════════
const HistoryPage = ({ history, onItemClick }) => {
  const [query, setQuery] = useState('');
  const [catTab, setCatTab] = useState('工作');
  const filtered = history.filter(t => {
    if ((t.category||'工作') !== catTab) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return (t.title||'').toLowerCase().includes(q) || (t.owner||'').toLowerCase().includes(q);
  });
  const grouped = {};
  filtered.forEach(t => { const d = t.completionDate ? new Date(t.completionDate+'T00:00:00') : null; const key = d&&!isNaN(d)?`${d.getFullYear()} 年 ${d.getMonth()+1} 月`:'未知'; if(!grouped[key])grouped[key]=[]; grouped[key].push(t); });
  return (
    <div>
      <div className="cat-tab-bar">
        {['工作','生活'].map(cat => <button key={cat} className={`cat-tab-btn${catTab===cat?' active':''}`} onClick={() => setCatTab(cat)}>{cat==='工作'?'💼 工作':'🏠 生活'}</button>)}
      </div>
      <div className="h-search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#bbb" strokeWidth="1.5"/><line x1="10.5" y1="10.5" x2="15" y2="15" stroke="#bbb" strokeWidth="1.5" strokeLinecap="round"/></svg>
        <input placeholder="搜尋關鍵字 / 負責人..." value={query} onChange={e => setQuery(e.target.value)}/>
        {query && <span onClick={() => setQuery('')} style={{cursor:'pointer',color:'#bbb',fontSize:20,lineHeight:1}}>×</span>}
      </div>
      {filtered.length===0 && <div className="empty">查無結果</div>}
      {Object.entries(grouped).map(([month,items]) => (
        <div key={month}>
          <div className="h-month">{month}</div>
          {items.map((t,i) => (
            <div key={i} className="h-row" onClick={() => onItemClick(t)}>
              <div className="h-top"><PBadge level={t.priority}/><span className="h-title">{t.title}</span><span className="h-date">{fmtShort(t.completionDate)}</span></div>
              <div className="h-meta">負責人：{t.owner||'—'}</div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
};

  const handleSave = () => { localStorage.setItem('ai_engine',engine); localStorage.setItem('gemini_key',geminiKey.trim()); localStorage.setItem('claude_key',claudeKey.trim()); setSaved(true); setTimeout(()=>setSaved(false),2000); };

    <div style={{background:'var(--bg)',minHeight:'100%',paddingBottom:'calc(40px + env(safe-area-inset-bottom,0px))'}}>
      <div className="page-hdr"><span className="back-btn" onClick={onBack}>‹</span><span className="page-hdr-title">設定</span><span></span></div>
      <div style={{background:'var(--card)',marginBottom:8}}>
        <div style={{padding:'14px 16px 10px'}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>🤖 AI 分析引擎</div>
          <div style={{display:'flex',gap:8}}>
            {[{id:'gemini',label:'Gemini',sub:'免費',color:'#4285F4'},{id:'claude',label:'Claude',sub:'付費更強',color:'#D97706'}].map(e=>(
              <button key={e.id} onClick={()=>setEngine(e.id)} style={{flex:1,padding:'10px 8px',borderRadius:10,border:engine===e.id?'none':'1px solid var(--border)',background:engine===e.id?e.color:'#fff',color:engine===e.id?'#fff':'var(--text-muted)',cursor:'pointer',fontFamily:'inherit',transition:'all 0.15s'}}>
                <div style={{fontWeight:600,fontSize:14}}>{e.label}</div>
                <div style={{fontSize:10,marginTop:2,opacity:0.9}}>{e.sub}</div>
              </button>

        </div>
      </div>
      <div style={{background:'var(--card)',marginBottom:8}}>
        <div style={{padding:'14px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}><div style={{fontSize:13,fontWeight:500}}>Gemini API Key</div>{engine==='gemini'&&<span style={{fontSize:10,background:'#4285F4',color:'#fff',padding:'1px 7px',borderRadius:10}}>使用中</span>}</div>
          <div style={{fontSize:11,color:'#bbb',marginBottom:8}}>免費：<span style={{color:'var(--blue)'}}>aistudio.google.com</span></div>
          <input className="settings-key-input" type="password" placeholder="AIza..." value={geminiKey} onChange={e=>setGeminiKey(e.target.value)}/>
        </div>

      <div style={{background:'var(--card)',marginBottom:8}}>
        <div style={{padding:'14px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}><div style={{fontSize:13,fontWeight:500}}>Claude API Key</div>{engine==='claude'&&<span style={{fontSize:10,background:'#D97706',color:'#fff',padding:'1px 7px',borderRadius:10}}>使用中</span>}</div>
          <div style={{fontSize:11,color:'#bbb',marginBottom:8}}>付費：<span style={{color:'var(--blue)'}}>console.anthropic.com</span></div>
          <input className="settings-key-input" type="password" placeholder="sk-ant-..." value={claudeKey} onChange={e=>setClaudeKey(e.target.value)}/>
        </div>
      </div>
      <div style={{background:'var(--card)',marginBottom:8}}>
        <div style={{padding:'14px 16px'}}><button className="btn btn-primary" style={{width:'100%'}} onClick={handleSave}>{saved?'✓ 已儲存':'儲存設定'}</button></div>
      </div>
      <div style={{background:'var(--card)'}}>
        <div style={{padding:'14px 16px'}}><div style={{fontSize:12,color:'#bbb'}}>工作追蹤 PWA v3.2　API Key 僅存於本機</div></div>

};

// NOTE FORM PAGE
// ════════════════════════════════════════════════════
const NoteFormPage = ({ initial, onBack, onSave }) => {
  const blank = { id:'', category:'', conclusion:'', detail:'', points:'', tags:'', createdDate: todayStr() };
  const [form, setForm] = useState(initial ? { ...blank, ...initial } : blank);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const handleSave = () => {
    if (!form.conclusion.trim()) { alert('請填入結論'); return; }
    const notes = getNotes();
    if (form.id) { const idx = notes.findIndex(n => n.id===form.id); if(idx>=0) notes[idx]=form; else notes.unshift(form); } else { notes.unshift({ ...form, id: 'N'+Date.now() }); }
    saveNotes(notes); onSave(notes);
  };
  return (
    <div className="form-wrap">
      <div className="page-hdr"><span className="back-btn" onClick={onBack}>‹</span><span className="page-hdr-title">{form.id?'編輯筆記':'新增學習筆記'}</span><span></span></div>
      <div style={{background:'#F3F0FF',padding:'10px 16px',fontSize:12,color:'#5B3EA0',lineHeight:1.8,marginBottom:8}}>📐 <strong>結論先行</strong>：先寫最重要的結論<br/>🌳 <strong>見林再見樹</strong>：先說大局影響，再列細節</div>
      <div className="form-section"><div className="form-row"><span className="f-label">類別</span><input type="text" placeholder="客戶管理 / 報表 / 談判 / 溝通..." value={form.category} onChange={e=>set('category',e.target.value)}/></div></div>
      <div className="form-section"><div className="form-textarea-wrap"><label>🎯 結論（必填，一句話）</label><textarea placeholder="最重要的結論，結論先行..." value={form.conclusion} rows={2} onChange={e=>set('conclusion',e.target.value)} style={{width:'100%',border:'none',outline:'none',fontSize:14,background:'transparent',color:'var(--text)',fontFamily:'inherit',resize:'none',lineHeight:1.7}}/></div></div>
      <div className="form-section"><div className="form-textarea-wrap"><label>🌳 背景說明（見林：整體影響與大局）</label><textarea placeholder="為什麼這個結論重要？影響是什麼？" value={form.detail} rows={3} onChange={e=>set('detail',e.target.value)} style={{width:'100%',border:'none',outline:'none',fontSize:14,background:'transparent',color:'var(--text)',fontFamily:'inherit',resize:'none',lineHeight:1.7}}/></div></div>
      <div className="form-section"><div className="form-textarea-wrap"><label>🌿 注意事項（見樹：條列細節）</label><textarea placeholder="• 細節一&#10;• 細節二&#10;• 細節三" value={form.points} rows={5} onChange={e=>set('points',e.target.value)} style={{width:'100%',border:'none',outline:'none',fontSize:14,background:'transparent',color:'var(--text)',fontFamily:'inherit',resize:'none',lineHeight:1.7}}/></div></div>
      <div className="form-section">
        <div className="form-row"><span className="f-label">提醒標籤</span><input type="text" placeholder="Cliff, KOE, 報告（逗號分隔）" value={form.tags} onChange={e=>set('tags',e.target.value)}/></div>
        <div style={{padding:'2px 16px 10px',fontSize:11,color:'#bbb'}}>新增任務時，標題含這些關鍵字即自動彈出提醒</div>
      </div>
      <div className="btn-row"><button className="btn btn-primary" onClick={handleSave}>存檔</button><button className="btn btn-secondary" onClick={onBack}>取消</button></div>
    </div>
  );
};

// NOTES LIST PAGE
// ════════════════════════════════════════════════════
const NotesListPage = ({ notes, onBack, onAdd, onEdit, onDelete }) => {
  const [expanded, setExpanded] = useState(null);
  const [query, setQuery] = useState('');
  const filtered = notes.filter(n => { if (!query) return true; const q = query.toLowerCase(); return (n.conclusion||'').toLowerCase().includes(q)||(n.category||'').toLowerCase().includes(q)||(n.tags||'').toLowerCase().includes(q); });
  return (
    <div style={{background:'var(--bg)',minHeight:'100%',paddingBottom:40}}>
      <div className="page-hdr"><span className="back-btn" onClick={onBack}>‹</span><span className="page-hdr-title">學習筆記</span><span className="hdr-action" onClick={onAdd}>＋ 新增</span></div>
      <div style={{background:'#F3F0FF',padding:'8px 16px',fontSize:11,color:'#5B3EA0',lineHeight:1.7}}>底層邏輯：<strong>結論先行</strong> ✦ <strong>見林再見樹</strong></div>
      <div className="h-search" style={{margin:'8px 14px'}}>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#bbb" strokeWidth="1.5"/><line x1="10.5" y1="10.5" x2="15" y2="15" stroke="#bbb" strokeWidth="1.5" strokeLinecap="round"/></svg>
        <input placeholder="搜尋筆記..." value={query} onChange={e=>setQuery(e.target.value)}/>
        {query && <span onClick={()=>setQuery('')} style={{cursor:'pointer',color:'#bbb',fontSize:20,lineHeight:1}}>×</span>}
      </div>
      {filtered.length===0 && <div className="empty">{notes.length===0?'尚無學習筆記':'查無結果'}</div>}
      {filtered.map((n,i) => (
        <div key={n.id}>
          <div className="note-list-item" onClick={() => setExpanded(expanded===i?null:i)}>
            <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
              <div style={{flex:1}}>{n.category && <div className="note-cat-tag">{n.category}</div>}<div className="note-conclusion-text">{n.conclusion}</div>{n.tags && <div className="note-tags-text">🏷 {n.tags}</div>}</div>
              <span style={{fontSize:16,color:'#bbb',flexShrink:0,paddingTop:2}}>{expanded===i?'∨':'›'}</span>
            </div>
          </div>
          {expanded===i && (
            <div className="note-detail-wrap">
              {n.detail && <div style={{marginBottom:8}}><div style={{fontSize:11,color:'#667eea',fontWeight:600,marginBottom:3}}>🌳 背景說明</div><div style={{fontSize:13,color:'#555',lineHeight:1.7}}>{n.detail}</div></div>}
              {n.points && <div style={{marginBottom:10}}><div style={{fontSize:11,color:'#667eea',fontWeight:600,marginBottom:3}}>🌿 注意事項</div><div style={{fontSize:13,color:'#555',lineHeight:1.8,whiteSpace:'pre-wrap'}}>{n.points}</div></div>}
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button className="btn btn-edit" style={{fontSize:12,padding:'6px 14px',flex:1}} onClick={()=>onEdit(n)}>編輯</button>
                <button className="btn btn-secondary" style={{fontSize:12,padding:'6px 14px',flex:1}} onClick={()=>onDelete(n.id)}>刪除</button>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
};

// ════════════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════════════
const TAB_ICONS = {
  dashboard: (<svg width="19" height="19" viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.85"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.4"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.4"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.4"/></svg>),
  meetings:  (<svg width="19" height="19" viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="13" rx="2" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.6"/><rect x="6" y="2" width="2" height="4" rx="1" fill="currentColor" opacity="0.6"/><rect x="12" y="2" width="2" height="4" rx="1" fill="currentColor" opacity="0.6"/><line x1="2" y1="9" x2="18" y2="9" stroke="currentColor" strokeWidth="1.2" opacity="0.5"/></svg>),
  tasks:     (<svg width="19" height="19" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.6"/><line x1="7" y1="8" x2="13" y2="8" stroke="currentColor" strokeWidth="1.5" opacity="0.6"/><line x1="7" y1="12" x2="10.5" y2="12" stroke="currentColor" strokeWidth="1.5" opacity="0.6"/></svg>),
  history:   (<svg width="19" height="19" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.6"/><polyline points="10,6 10,10 13,12" stroke="currentColor" strokeWidth="1.5" fill="none" opacity="0.6"/></svg>),
};

const App = () => {
  const [gasUrl, setGasUrl] = useState(HARDCODED_GAS_URL);
  const [tab, setTab] = useState('dashboard');
  const [meetings, setMeetings] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [history, setHistory] = useState([]);
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(false);
  const [meetLoading, setMeetLoading] = useState(false);
  const [view, setView] = useState('list');
  const [selectedTask, setSelectedTask] = useState(null);
  const [toast, setToast] = useState('');
  const [defaultCat, setDefaultCat] = useState('工作');
  const [notes, setNotes] = useState(() => getNotes());
  const [selectedNote, setSelectedNote] = useState(null);

  const showToast = msg => { setToast(msg); setTimeout(() => setToast(''), 4000); };
  const saveGasUrl = url => { localStorage.setItem('gas_url', url); GAS_URL = url; setGasUrl(url); };

  useEffect(() => { loadAll(); }, []);

  useEffect(() => {
    const timer = setInterval(async () => {
      if (view !== 'list') return;
      try {
        const res = await api.get('getAll', { date: todayStr() });
        if (res?.tasks) { const sorted = sortByPriority(res.tasks); setTasks(sorted); try { localStorage.setItem('cache_tasks', JSON.stringify(sorted)); } catch(e) {} }
        if (res?.members) setMembers(res.members);
      } catch(e) {}
      loadHistory();
    }, 60000);
    return () => clearInterval(timer);
  }, [view]);

  const loadAll = async (isRetry = false) => {
    if (!isRetry) {
      try {
        const ct = localStorage.getItem('cache_tasks'); const cm = localStorage.getItem('cache_members'); const cmt = localStorage.getItem('cache_meetings_'+todayStr());
        if (ct) setTasks(JSON.parse(ct)); if (cm) setMembers(JSON.parse(cm)); if (cmt) setMeetings(JSON.parse(cmt));
      } catch(e) {}
    }
    setLoading(true);
    let loadOk = false;
    const maxTries = isRetry ? 2 : 3;
    for (let attempt = 1; attempt <= maxTries; attempt++) {
      try {
        showToast(`⟳ 連線中 (${attempt}/${maxTries})...`);
        const res = await api.get('getAll', { date: todayStr() });
        const sorted = sortByPriority(res.tasks || []);
        setTasks(sorted);
        if (res.members && res.members.length > 0) setMembers(res.members);
        try { localStorage.setItem('cache_tasks', JSON.stringify(sorted)); if (res.members && res.members.length > 0) localStorage.setItem('cache_members', JSON.stringify(res.members)); } catch(ce) {}
        showToast('✓ 任務已同步'); loadOk = true; break;
      } catch(e) {
        if (attempt < maxTries) { showToast(`⏳ 第 ${attempt} 次連線失敗，${attempt+1} 秒後重試...`); await new Promise(r => setTimeout(r, attempt * 1000)); }
      }
    }
    if (!loadOk) showToast('⚠ 連線失敗，顯示快取資料（請稍後重新整理）');
    setLoading(false);
    loadMeetings();
    loadHistory();
  };

  const loadHistory = async () => { try { const h = await api.getHistory(); setHistory(h.history || []); } catch(e) {} };

  const loadMeetings = async () => {
    setMeetLoading(true); showToast('⟳ 同步會議中...');
    try {
      const res = await api.getMeetings(todayStr());
      const doneMap = JSON.parse(localStorage.getItem(`meeting_done_${todayStr()}`) || '{}');
      const ms = (res.meetings || []).map(m => ({ ...m, done: !!doneMap[m.title] }));
      setMeetings(ms);
      // ★ FIX: 寫入快取（原本只讀不寫）
      try { localStorage.setItem('cache_meetings_' + todayStr(), JSON.stringify(ms)); } catch(ce) {}
      showToast(ms.length > 0 ? `✓ 會議已同步（${ms.length} 場）` : '✓ 同步完成（今日無會議）');
    } catch (e) {
      // 載入快取作為備援
      try {
        const cached = localStorage.getItem('cache_meetings_' + todayStr());
        if (cached) { setMeetings(JSON.parse(cached)); showToast('⚠ ICS 同步失敗，顯示快取會議'); }
        else showToast('⚠ 會議同步失敗（請確認 Sheets Settings 的 ICS_URL）');
      } catch(ce) { showToast('⚠ 會議同步失敗'); }
    }
    setMeetLoading(false);
  };

  const handleAddTask = async data => {
    const newTask = { ...data, id: `T${Date.now()}` };
    try {
      await api.addTask(newTask);
      setTasks(prev => sortByPriority([...prev, newTask]));
      setView('list'); showToast('✓ 任務已新增');
      setTimeout(async () => { try { const res = await api.getTasks(); if (res.tasks) setTasks(sortByPriority(res.tasks)); } catch(e) {} }, 2000);
    } catch(e) { alert(e.name==='AbortError' ? '⚠ 連線逾時，任務可能未儲存' : '⚠ 新增失敗：' + e.message); }
  };

  const handleSavedTask = (id, data) => {
    setTasks(prev => { const updated = sortByPriority(prev.map(t => t.id===id ? {...t,...data} : t)); try { localStorage.setItem('cache_tasks', JSON.stringify(updated)); } catch(e) {} return updated; });
    showToast('✓ 已更新');
  };

  const handleClosedTask = (id, data) => { setTasks(prev => prev.filter(t => t.id!==id)); setHistory(prev => [{...data}, ...prev]); setView('list'); showToast('✓ 任務已結案'); };
  const handleDeleteTask = async (id) => { if (!window.confirm('確定要刪除此任務嗎？此操作無法復原。')) return; try { await api.deleteTask(id); setTasks(prev => prev.filter(t => t.id!==id)); setView('list'); showToast('✓ 任務已刪除'); } catch(e) { alert('⚠ 刪除失敗：' + e.message); } };
  const handleDeleteHistory = async (id) => { if (!window.confirm('確定要刪除此歷史紀錄嗎？')) return; try { await api.deleteHistory(id); setHistory(prev => prev.filter(t => t.id!==id)); setView('list'); showToast('✓ 已刪除'); } catch(e) { alert('⚠ 刪除失敗：' + e.message); } };

  const pageWrap = content => (<div style={{height:'100vh',overflowY:'auto',WebkitOverflowScrolling:'touch',background:'var(--bg)'}}>{content}</div>);

  if (view === 'settings') return pageWrap(<SettingsPage onBack={() => setView('list')}/>);
  if (view === 'notesList') return pageWrap(<NotesListPage notes={notes} onBack={() => setView('list')} onAdd={() => { setSelectedNote(null); setView('noteForm'); }} onEdit={n => { setSelectedNote(n); setView('noteForm'); }} onDelete={id => { if (!window.confirm('確定刪除此筆記？')) return; const updated = notes.filter(n => n.id!==id); saveNotes(updated); setNotes(updated); }}/>);
  if (view === 'noteForm') return pageWrap(<NoteFormPage initial={selectedNote} onBack={() => setView(selectedNote?'notesList':'list')} onSave={updated => { setNotes(updated); setView('notesList'); }}/>);
  if (view === 'add') return pageWrap(<TaskFormPage members={members} onBack={() => setView('list')} onSave={handleAddTask} mode="add" defaultCategory={defaultCat}/>);
  if (view === 'detail' && selectedTask) return pageWrap(<TaskDetailPage task={selectedTask} members={members} onBack={() => setView('list')} onSaved={handleSavedTask} onClosed={handleClosedTask} onDelete={handleDeleteTask}/>);
  if (view === 'historyDetail' && selectedTask) return pageWrap(<TaskDetailPage task={selectedTask} members={members} onBack={() => setView('list')} onSaved={() => {}} onClosed={() => {}} onDelete={handleDeleteHistory} isHistory={true}/>);

  const renderContent = () => {
    if (loading) return <div className="spinner" style={{flexDirection:'column',gap:12}}><div style={{fontSize:28}}>⟳</div><div>載入中，首次約需 5-10 秒...</div></div>;
    switch (tab) {
      case 'dashboard': return <Dashboard meetings={meetings} tasks={tasks} onTaskClick={t=>{setSelectedTask(t);setView('detail');}} onSettings={()=>setView('settings')} notes={notes} onViewNotes={()=>setView('notesList')} onAddNote={()=>{setSelectedNote(null);setView('noteForm');}}/>;
      case 'meetings': return <MeetingsPage meetings={meetings} setMeetings={setMeetings} onRefresh={loadMeetings} loading={meetLoading}/>;
      case 'tasks': return <TasksPage tasks={tasks} onTaskClick={t=>{setSelectedTask(t);setView('detail');}} onAddTask={cat=>{setDefaultCat(cat);setView('add');}}/>;
      case 'history': return <HistoryPage history={history} onItemClick={t=>{setSelectedTask(t);setView('historyDetail');}}/>;
    }
  };

  return (
    <>
      <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="scroll-area">{renderContent()}</div>
        <div className="tab-bar">
          {[{key:'dashboard',label:'戰情中心'},{key:'meetings',label:'今日會議'},{key:'tasks',label:'Tasks'},{key:'history',label:'歷史紀錄'}].map(({key,label}) => (
            <div key={key} className={`tab-item ${tab===key?'active':''}`} onClick={() => setTab(key)}>
              {TAB_ICONS[key]}<span className="t-label">{label}</span><div className="t-bar"/>
            </div>
          ))}
        </div>
      </div>
      {toast && <div className="toast">{toast}</div>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
